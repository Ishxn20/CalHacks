[project]
name = "scrub-voice"
version = "0.1.0"
description = "Speech to instrument code for the robotic scrub assistant"
requires-python = ">=3.10"
# scrub-arm is only needed for the shared config/tray.yaml vocabulary + Catalog; install it from ../arm.
# Speech-to-text is Cartesia Ink (cloud); sounddevice records the mic.
dependencies = ["scrub-arm", "cartesia>=4.2", "sounddevice", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["scrub_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
