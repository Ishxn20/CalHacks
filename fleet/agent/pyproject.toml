[project]
name = "scrub-fleet"
version = "0.1.0"
description = "Robot-side agent for the scrub-arm fleet platform: telemetry, episode recording, Cartesia voice"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "opencv-python>=4.9", "pyyaml>=6.0", "cartesia>=4.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["scrub_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
