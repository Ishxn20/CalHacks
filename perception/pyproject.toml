[project]
name = "scrub-vision"
version = "0.1.0"
description = "Pile segmentation, identification and declutter planning for the scrub assistant"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pyyaml>=6.0", "opencv-python>=4.9", "trimesh>=4.0", "ultralytics>=8.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["scrub_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a model"]
