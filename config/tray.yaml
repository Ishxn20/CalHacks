# Instrument vocabulary + physical tray layout.
#
# `instruments` is what the voice/intent pipeline can ask for. `category` lets a
# generic request ("needle holder, 6-0 Prolene") match any specific model whose
# slot is loaded with the right suture.
#
# `slots` is what is physically on the tray. Each slot names the taught poses
# (from poses.yaml) the gripper passes through from a safe hover to the grasp.
# Retreat runs the same list in reverse.

# jaw_open_mm: jaw gap (mm) to come down and let go with, for camera picks of our 8 printed parts: the width under
# the jaws at the grab point, measured on 400+ real wrist-camera views (perception/scrub_vision/red_parts.py, grip_w),
# + 2 x 10 mm (aim error ~2 mm + yaw error + room), so the open jaws come down without sweeping into the neighbours:
# scalpels #10 12.9 / #20 15.2 / long #11 13.5, forceps 9.4, micro scissors 9.6 (on its side) - 10.7 (flat), needle
# holders 21 (both shanks). Closing: the jaws close until they stall on the tool, then squeeze gripper.squeeze_mm
# further (arm.yaml).
instruments:
  needle_holder_castroviejo: {name: Castroviejo needle holder, category: needle_holder, orientable: true,
                              aliases: [castroviejo, castro, fine needle holder]}
  needle_holder_ryder:       {jaw_open_mm: 41, name: Ryder needle holder, category: needle_holder, orientable: true,
                              aliases: [ryder, rider]}
  needle_holder_long:        {name: Long needle holder, category: needle_holder, orientable: true,
                              aliases: [long needle holder, long driver]}
  needle_holder_short:       {jaw_open_mm: 41, name: Short needle holder, category: needle_holder, orientable: true,
                              aliases: [short needle holder, short driver]}
  forceps_debakey:           {name: DeBakey forceps, category: forceps,
                              aliases: [debakey, de bakey, debakeys, pickups]}
  forceps_resano:            {name: Resano forceps, category: forceps,
                              aliases: [resano, heavy forceps]}
  forceps_fine_vascular:     {jaw_open_mm: 30, name: Fine vascular forceps, category: forceps,
                              aliases: [fine forceps, vascular forceps, fine pickups, tweezers, tweezer]}
  scalpel_10:                {jaw_open_mm: 33, name: "#10 scalpel", category: scalpel, aliases: [10 blade, number 10, "#10", ten blade]}
  scalpel_11:                {name: "#11 scalpel", category: scalpel, aliases: [11 blade, number 11, "#11", eleven blade]}
  scalpel_15:                {name: "#15 scalpel", category: scalpel, aliases: [15 blade, number 15, "#15", fifteen blade]}
  scalpel_20:                {jaw_open_mm: 35, name: "#20 scalpel", category: scalpel, aliases: [20 blade, number 20, "#20", twenty blade]}
  scalpel_11_long:           {jaw_open_mm: 34, name: "Long #11 scalpel", category: scalpel,
                              aliases: [long scalpel, long 11 blade, long eleven blade, long blade, "#3l", 3l handle]}
  scissors_potts:            {name: Potts scissors, category: scissors, orientable: true,
                              aliases: [potts, pots, pott scissors]}
  scissors_micro_forward:    {jaw_open_mm: 31, name: Forward micro scissors, category: scissors, orientable: true,
                              aliases: [micro scissors, micros, forward micro scissors, forward facing micro scissors, forward scissors]}
  scissors_micro_back:       {jaw_open_mm: 31, name: Back-facing micro scissors, category: scissors, orientable: true,
                              aliases: [back micro scissors, back facing micro scissors, backward micro scissors, back scissors]}
  clamp_aortic_cross:        {name: Aortic cross-clamp, category: clamp,
                              aliases: [cross clamp, crossclamp, aortic clamp, cross-clamp]}
  clamp_side_biting:         {name: Side-biting clamp, category: clamp,
                              aliases: [side biting clamp, side biter, partial occlusion clamp]}
  probe_coronary:            {name: Coronary probe, category: probe,
                              aliases: [probe, coronary probe, coronary dilator]}

# The set we actually have (user photo 2026-10-24): camera picks (pick.mode ik) only take these. Everything else
# the camera sees is something to move out of the way.
in_set: [scalpel_10, scalpel_20, scalpel_11_long, forceps_fine_vascular, scissors_micro_forward,
         scissors_micro_back, needle_holder_short, needle_holder_ryder]

# Canonical suture names and what people may say instead.
sutures:
  prolene:  [prolene, polypropylene, pro lean, prolean]
  ethibond: [ethibond, polyester, ethi bond]
  vicryl:   [vicryl, polyglactin, vicral]
  goretex:  [goretex, gore-tex, gore tex, ptfe, cv-4, cv-5, cv4, cv5]

# Demo tray: 8 slots. Change instrument/suture/size to match what's actually loaded.
slots:
  - {id: A1, instrument: needle_holder_castroviejo, suture: prolene, size: 6-0, approach: [A1.above, A1.grasp]}
  - {id: A2, instrument: needle_holder_ryder,       suture: prolene, size: 4-0, approach: [A2.above, A2.grasp]}
  - {id: A3, instrument: forceps_debakey,                                         approach: [A3.above, A3.grasp]}
  - {id: A4, instrument: scalpel_11,                                              approach: [A4.above, A4.grasp]}
  - {id: B1, instrument: scissors_potts,                                          approach: [B1.above, B1.grasp]}
  - {id: B2, instrument: clamp_aortic_cross,                                      approach: [B2.above, B2.grasp]}
  - {id: B3, instrument: clamp_side_biting,                                       approach: [B3.above, B3.grasp]}
  - {id: B4, instrument: probe_coronary,             size: 1.5mm,                  approach: [B4.above, B4.grasp]}
